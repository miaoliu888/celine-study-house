<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- maskable 图标：核心内容在中心 80% 区域 -->
  <rect width="512" height="512" fill="#FFF7FA"/>
  <g transform="translate(256 256) scale(0.7) translate(-256 -256)">
    <!-- 耳朵 -->
    <ellipse cx="172" cy="160" rx="38" ry="80" fill="#FF8FB1" transform="rotate(-8 172 160)"/>
    <ellipse cx="172" cy="160" rx="20" ry="58" fill="#FFF0F5" transform="rotate(-8 172 160)"/>
    <ellipse cx="340" cy="160" rx="38" ry="80" fill="#FF8FB1" transform="rotate(8 340 160)"/>
    <ellipse cx="340" cy="160" rx="20" ry="58" fill="#FFF0F5" transform="rotate(8 340 160)"/>
    <!-- 头 -->
    <ellipse cx="256" cy="320" rx="160" ry="148" fill="#FF8FB1"/>
    <ellipse cx="256" cy="320" rx="150" ry="138" fill="#FFE0EC"/>
    <!-- 腮红 -->
    <ellipse cx="180" cy="372" rx="26" ry="16" fill="#FFB8C8" opacity=".75"/>
    <ellipse cx="332" cy="372" rx="26" ry="16" fill="#FFB8C8" opacity=".75"/>
    <!-- 眼睛 -->
    <path d="M194 332 Q224 316 254 332" stroke="#4A2A38" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M258 332 Q288 316 318 332" stroke="#4A2A38" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M244 384 Q256 392 268 384" stroke="#4A2A38" stroke-width="5" fill="none" stroke-linecap="round"/>
    <!-- 头戴花 -->
    <g transform="translate(340 198)">
      <ellipse cx="0" cy="-22" rx="18" ry="24" fill="#FFB8C8" stroke="#F26B97" stroke-width="2" transform="rotate(-90)"/>
      <ellipse cx="20" cy="-7" rx="18" ry="24" fill="#FFB8C8" stroke="#F26B97" stroke-width="2" transform="rotate(-18)"/>
      <ellipse cx="13" cy="16" rx="18" ry="24" fill="#FFB8C8" stroke="#F26B97" stroke-width="2" transform="rotate(54)"/>
      <ellipse cx="-13" cy="16" rx="18" ry="24" fill="#FFB8C8" stroke="#F26B97" stroke-width="2" transform="rotate(126)"/>
      <ellipse cx="-20" cy="-7" rx="18" ry="24" fill="#FFB8C8" stroke="#F26B97" stroke-width="2" transform="rotate(198)"/>
      <circle cx="0" cy="0" r="12" fill="#FFD66B" stroke="#C8A03B" stroke-width="2"/>
    </g>
  </g>
</svg>
